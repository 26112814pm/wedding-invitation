<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>시안 2: 설계 도면 스타일</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Gowun Batang', serif;
  background: #1a3a5c;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
  position: relative;
}

/* 격자 배경 */
body::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 20px 20px;
}

.container {
  text-align: center;
  position: relative;
  z-index: 1;
}

/* 하트 SVG 도면 */
.heart-blueprint {
  margin: 0 auto 30px;
  width: 160px; height: 150px;
  position: relative;
}
.heart-blueprint svg { overflow: visible; }

.heart-path {
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  animation: drawHeart 2.5s ease-in-out forwards;
}

@keyframes drawHeart {
  to { stroke-dashoffset: 0; }
}

/* 치수선 */
.dimension {
  position: absolute;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards;
}
.dim-top { top: -20px; left: 50%; transform: translateX(-50%); animation-delay: 2.5s; }
.dim-side { right: -55px; top: 50%; transform: translateY(-50%); animation-delay: 2.8s; }
.dim-text {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.5);
  font-family: monospace;
  letter-spacing: 1px;
}

/* 좌표 점 */
.coord-dot {
  position: absolute;
  width: 6px; height: 6px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  opacity: 0;
  animation: fadeIn 0.3s ease forwards;
}
.dot1 { top: 25px; left: 35px; animation-delay: 1s; }
.dot2 { top: 25px; right: 35px; animation-delay: 1.3s; }
.dot3 { bottom: 10px; left: 50%; transform: translateX(-50%); animation-delay: 2s; }

@keyframes fadeIn { to { opacity: 1; } }

/* LOVE SPEC 태그 */
.spec-tag {
  opacity: 0;
  animation: fadeIn 0.5s ease forwards;
  animation-delay: 2s;
  margin-bottom: 24px;
}
.spec-text {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
  font-family: monospace;
  letter-spacing: 3px;
  border: 1px solid rgba(255,255,255,0.15);
  padding: 4px 12px;
  display: inline-block;
}

/* 이름 */
.names {
  opacity: 0;
  transform: translateY(15px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 3s;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-bottom: 20px;
}
.name { font-size: 1.6rem; font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 4px; }
.heart-text { color: #E8917A; font-size: 1rem; }

/* 결혼합니다 */
.message {
  opacity: 0;
  transform: translateY(12px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 3.8s;
}
.line { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; }
.dash { width: 50px; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent); }
.msg-text { font-size: 1.2rem; color: rgba(255,255,255,0.7); letter-spacing: 6px; }

@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

/* 페이드 아웃 (전체) */
.container.fadeout {
  animation: containerFade 1s ease forwards;
}
@keyframes containerFade {
  to { opacity: 0; }
}
</style>
</head>
<body>
<div class="container" id="container">
  <!-- 하트 도면 -->
  <div class="heart-blueprint">
    <svg width="160" height="150" viewBox="-10 -10 180 170">
      <path class="heart-path" d="M80 140 C80 140, 0 90, 0 45 C0 20, 20 0, 45 0 C60 0, 72 10, 80 25 C88 10, 100 0, 115 0 C140 0, 160 20, 160 45 C160 90, 80 140, 80 140Z"
        fill="none" stroke="rgba(232,145,122,0.7)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 중심선 -->
      <line x1="80" y1="-5" x2="80" y2="145" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    </svg>
    <!-- 좌표 점 -->
    <div class="coord-dot dot1"></div>
    <div class="coord-dot dot2"></div>
    <div class="coord-dot dot3"></div>
    <!-- 치수선 -->
    <div class="dimension dim-top"><span class="dim-text">W: 160mm</span></div>
    <div class="dimension dim-side"><span class="dim-text">H: 150mm</span></div>
  </div>

  <div class="spec-tag"><span class="spec-text">LOVE SPEC. Rev.01</span></div>

  <div class="names">
    <span class="name">장재균</span>
    <span class="heart-text">&#9829;</span>
    <span class="name">배유빈</span>
  </div>

  <div class="message">
    <div class="line">
      <span class="dash"></span>
      <span class="dash"></span>
    </div>
    <p class="msg-text">결혼합니다</p>
  </div>
</div>
</body>
</html>
