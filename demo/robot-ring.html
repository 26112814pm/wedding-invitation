<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>시안: 로봇팔 + 반지</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Gowun Batang', serif;
  background: linear-gradient(180deg, #FFF9F5 0%, #FFFFFF 40%, #F2E6DC 100%);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
}
.container { text-align: center; position: relative; }

/* 로봇팔 */
.robot-arm {
  position: relative;
  width: 200px; height: 260px;
  margin: 0 auto;
}

/* 팔 본체 */
.arm-group {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  top: -60px;
  animation: armDown 1.5s ease-in-out forwards,
             armUp 1s ease-in-out 3s forwards;
}

@keyframes armDown {
  0% { top: -180px; }
  100% { top: -60px; }
}
@keyframes armUp {
  0% { top: -60px; opacity: 1; }
  100% { top: -200px; opacity: 0; }
}

/* 팔 세그먼트 */
.arm-seg1 {
  width: 4px; height: 80px;
  background: linear-gradient(to bottom, #B0B0B0, #888);
  margin: 0 auto;
  border-radius: 2px;
  position: relative;
}
.arm-seg1::before {
  content: '';
  position: absolute; top: 0; left: -4px;
  width: 12px; height: 8px;
  background: #999;
  border-radius: 3px 3px 0 0;
}

/* 관절 */
.joint {
  width: 14px; height: 14px;
  background: radial-gradient(circle, #CCC, #999);
  border-radius: 50%;
  margin: -2px auto -2px;
  border: 1px solid #888;
  position: relative;
  z-index: 1;
}

.arm-seg2 {
  width: 3px; height: 50px;
  background: linear-gradient(to bottom, #999, #777);
  margin: 0 auto;
  border-radius: 2px;
}

/* 그리퍼 (집게) */
.gripper {
  width: 30px; height: 20px;
  margin: 0 auto;
  position: relative;
}
.finger-l, .finger-r {
  position: absolute;
  bottom: 0;
  width: 3px; height: 18px;
  background: #888;
  border-radius: 0 0 2px 2px;
}
.finger-l { left: 6px; transform: rotate(8deg); transform-origin: top center; }
.finger-r { right: 6px; transform: rotate(-8deg); transform-origin: top center; }
.finger-l::after, .finger-r::after {
  content: '';
  position: absolute; bottom: -1px; left: -2px;
  width: 7px; height: 3px;
  background: #777;
  border-radius: 1px;
}

/* 그리퍼 바 */
.gripper-bar {
  width: 24px; height: 4px;
  background: linear-gradient(to right, #AAA, #888, #AAA);
  margin: 0 auto;
  border-radius: 2px;
}

/* LED 표시등 */
.led {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #4CAF50;
  margin: 4px auto;
  animation: blink 0.8s ease infinite;
  box-shadow: 0 0 6px rgba(76, 175, 80, 0.6);
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* 스파크 (용접 불꽃) */
.sparks {
  position: absolute;
  bottom: 60px; left: 50%; transform: translateX(-50%);
  opacity: 0;
  animation: sparkShow 0.15s ease infinite alternate 1.5s,
             sparkHide 0.1s ease forwards 2.8s;
}
@keyframes sparkShow { 0% { opacity: 0.6; } 100% { opacity: 1; } }
@keyframes sparkHide { to { opacity: 0; } }

.spark {
  position: absolute;
  width: 2px; height: 2px;
  background: #FFD700;
  border-radius: 50%;
  box-shadow: 0 0 4px #FFD700, 0 0 8px #FFA500;
}
.s1 { top: 0; left: -8px; animation: sparkMove1 0.3s ease infinite 1.5s; }
.s2 { top: -5px; left: 3px; animation: sparkMove2 0.25s ease infinite 1.6s; }
.s3 { top: 2px; left: 8px; animation: sparkMove3 0.35s ease infinite 1.7s; }
.s4 { top: -3px; left: -4px; animation: sparkMove4 0.2s ease infinite 1.8s; }
.s5 { top: 4px; left: 0; animation: sparkMove5 0.28s ease infinite 1.55s; }

@keyframes sparkMove1 { 0% { transform: translate(0,0); opacity:1; } 100% { transform: translate(-10px,-15px); opacity:0; } }
@keyframes sparkMove2 { 0% { transform: translate(0,0); opacity:1; } 100% { transform: translate(8px,-12px); opacity:0; } }
@keyframes sparkMove3 { 0% { transform: translate(0,0); opacity:1; } 100% { transform: translate(12px,-8px); opacity:0; } }
@keyframes sparkMove4 { 0% { transform: translate(0,0); opacity:1; } 100% { transform: translate(-6px,-18px); opacity:0; } }
@keyframes sparkMove5 { 0% { transform: translate(0,0); opacity:1; } 100% { transform: translate(2px,10px); opacity:0; } }

/* 반지 */
.ring-area {
  position: absolute;
  bottom: 30px; left: 50%; transform: translateX(-50%);
}

/* 반지 본체 */
.ring {
  width: 50px; height: 30px;
  border: 3px solid #D4B896;
  border-radius: 50%;
  position: relative;
  opacity: 0;
  animation: ringAppear 0.5s ease forwards 2.5s;
  background: linear-gradient(135deg, transparent 40%, rgba(212,184,150,0.1) 50%, transparent 60%);
}
@keyframes ringAppear { to { opacity: 1; } }

/* 다이아몬드 */
.diamond {
  position: absolute;
  top: -14px; left: 50%; transform: translateX(-50%) scale(0);
  animation: diamondPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 3s;
}
@keyframes diamondPop { to { transform: translateX(-50%) scale(1); } }

/* 다이아몬드 반짝임 */
.sparkle {
  position: absolute;
  opacity: 0;
}
.sparkle1 { top: -22px; left: 50%; margin-left: -15px; animation: twinkle 1s ease infinite 3.5s; }
.sparkle2 { top: -18px; left: 50%; margin-left: 10px; animation: twinkle 1s ease infinite 3.8s; }
.sparkle3 { top: -8px; left: 50%; margin-left: -20px; animation: twinkle 1s ease infinite 4s; }

@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1); }
}

/* 하트 파티클 */
.hearts {
  position: absolute;
  bottom: 50px; left: 50%; transform: translateX(-50%);
}
.heart-p {
  position: absolute;
  font-size: 10px;
  color: #E8917A;
  opacity: 0;
}
.h1 { animation: heartFloat 1.5s ease forwards 3.3s; left: -20px; }
.h2 { animation: heartFloat 1.5s ease forwards 3.5s; left: 5px; }
.h3 { animation: heartFloat 1.5s ease forwards 3.7s; left: 15px; }
.h4 { animation: heartFloat 1.5s ease forwards 3.4s; left: -8px; }

@keyframes heartFloat {
  0% { opacity: 0; transform: translateY(0) scale(0.5); }
  30% { opacity: 1; transform: translateY(-20px) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
}

/* 이름 */
.names {
  margin-top: 20px;
  opacity: 0; transform: translateY(10px);
  animation: slideUp 0.8s ease forwards 3.8s;
  display: flex; align-items: center; justify-content: center; gap: 14px;
}
.name { font-size: 1.8rem; font-weight: 700; color: #3D3D3D; letter-spacing: 4px; }
.heart-icon { color: #E8917A; font-size: 1rem; }

/* 결혼합니다 */
.message {
  margin-top: 20px;
  opacity: 0; transform: translateY(10px);
  animation: slideUp 0.8s ease forwards 4.5s;
}
.line { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; }
.dash { width: 50px; height: 1px; background: linear-gradient(to right, transparent, #D4B896, transparent); }
.msg-text { font-size: 1.3rem; color: #5A5A5A; letter-spacing: 6px; }

@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <div class="robot-arm">
    <!-- 로봇팔 -->
    <div class="arm-group">
      <div class="led"></div>
      <div class="arm-seg1"></div>
      <div class="joint"></div>
      <div class="arm-seg2"></div>
      <div class="joint" style="width:10px;height:10px;"></div>
      <div class="gripper-bar"></div>
      <div class="gripper">
        <div class="finger-l"></div>
        <div class="finger-r"></div>
      </div>
    </div>

    <!-- 스파크 -->
    <div class="sparks">
      <div class="spark s1"></div>
      <div class="spark s2"></div>
      <div class="spark s3"></div>
      <div class="spark s4"></div>
      <div class="spark s5"></div>
    </div>

    <!-- 반지 -->
    <div class="ring-area">
      <div class="ring">
        <div class="diamond">
          <svg width="18" height="16" viewBox="0 0 24 20">
            <polygon points="4,0 20,0 24,7 12,20 0,7" fill="none" stroke="#D4B896" stroke-width="1.5"/>
            <line x1="4" y1="0" x2="12" y2="20" stroke="#D4B896" stroke-width="0.5" opacity="0.5"/>
            <line x1="20" y1="0" x2="12" y2="20" stroke="#D4B896" stroke-width="0.5" opacity="0.5"/>
            <line x1="0" y1="7" x2="24" y2="7" stroke="#D4B896" stroke-width="0.5" opacity="0.5"/>
            <line x1="12" y1="0" x2="12" y2="7" stroke="#D4B896" stroke-width="0.5" opacity="0.3"/>
          </svg>
        </div>
        <!-- 반짝임 -->
        <svg class="sparkle sparkle1" width="8" height="8" viewBox="0 0 10 10">
          <line x1="5" y1="0" x2="5" y2="10" stroke="#D4B896" stroke-width="1"/>
          <line x1="0" y1="5" x2="10" y2="5" stroke="#D4B896" stroke-width="1"/>
        </svg>
        <svg class="sparkle sparkle2" width="6" height="6" viewBox="0 0 10 10">
          <line x1="5" y1="0" x2="5" y2="10" stroke="#E8917A" stroke-width="1"/>
          <line x1="0" y1="5" x2="10" y2="5" stroke="#E8917A" stroke-width="1"/>
        </svg>
        <svg class="sparkle sparkle3" width="5" height="5" viewBox="0 0 10 10">
          <line x1="5" y1="0" x2="5" y2="10" stroke="#D4B896" stroke-width="1"/>
          <line x1="0" y1="5" x2="10" y2="5" stroke="#D4B896" stroke-width="1"/>
        </svg>
      </div>
      <!-- 하트 파티클 -->
      <div class="hearts">
        <span class="heart-p h1">&#9829;</span>
        <span class="heart-p h2">&#9829;</span>
        <span class="heart-p h3">&#9829;</span>
        <span class="heart-p h4">&#9829;</span>
      </div>
    </div>
  </div>

  <!-- 이름 -->
  <div class="names">
    <span class="name">장재균</span>
    <span class="heart-icon">&#9829;</span>
    <span class="name">배유빈</span>
  </div>

  <!-- 결혼합니다 -->
  <div class="message">
    <div class="line">
      <span class="dash"></span>
      <span class="dash"></span>
    </div>
    <p class="msg-text">결혼합니다</p>
  </div>
</div>
</body>
</html>
