<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>엘리베이터 약도 시안 v5</title>
    <link rel="preload" href="/wedding-invitation/fonts/OnglipUiyeon.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Onglip Uiyeon';
        src: url('/wedding-invitation/fonts/OnglipUiyeon.ttf') format('truetype');
        font-weight: 400; font-style: normal; font-display: swap;
      }
      :root { --orange:#FF6B1A; --bg:#FFF4E8; --text:#3D3D3D; --muted:#9A9A9A; --accent:#E89940; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Onglip Uiyeon', serif; background: var(--bg); color: var(--text); padding: 30px 16px 60px; }
      h1 { text-align: center; font-size: 1.5rem; margin-bottom: 6px; letter-spacing: 2px; }
      .subtitle { text-align: center; color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }
      .container { max-width: 460px; margin: 0 auto; }
      .card { background:#FFFFFF; border:1px solid #F8DEBC; border-radius:16px; padding:20px 14px; margin-bottom:36px; }
      .card-title { font-size:1.25rem; font-weight:700; text-align:center; margin-bottom:4px; }
      .card-desc { font-size:0.95rem; color:var(--muted); text-align:center; margin-bottom:14px; }
      .legend { margin-top:16px; display:flex; flex-direction:column; gap:10px; }
      .legend-item { display:flex; align-items:center; gap:10px; font-size:1.02rem; }
      .badge { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--orange); color:#fff; font-weight:700; font-size:0.9rem; display:flex; align-items:center; justify-content:center; }
      .legend-item b { color:var(--text); } .legend-item span { color:var(--muted); }
    </style>
  </head>
  <body>
    <h1>엘리베이터 약도 시안 v5</h1>
    <p class="subtitle">PPT 텍스트 위치 그대로 반영</p>

    <div class="container">
      <div class="card">
        <div class="card-title">엘리베이터 이용 안내</div>
        <div class="card-desc">입구마다 엘리베이터 1대 · 모두 8층 예식홀 연결</div>

        <svg viewBox="0 0 600 470" width="100%" style="display:block;">
          <!-- ===== 주변 건물 (연한 베이지 블록) ===== -->
          <g font-family="'Onglip Uiyeon',serif" fill="#7A6E5B">
            <!-- 북: 분당제생병원 -->
            <rect x="130" y="20" width="420" height="74" rx="6" fill="#ECE3D0" stroke="#D9CDB2" stroke-width="1"/>
            <text x="340" y="63" text-anchor="middle" font-size="20" font-weight="700">분당제생병원</text>

            <!-- 서: 분당제일여성병원 -->
            <rect x="20" y="115" width="85" height="220" rx="6" fill="#ECE3D0" stroke="#D9CDB2" stroke-width="1"/>
            <text x="62" y="218" text-anchor="middle" font-size="14" font-weight="700">분당제일</text>
            <text x="62" y="240" text-anchor="middle" font-size="14" font-weight="700">여성병원</text>

            <!-- 동: 작은 건물 2개 -->
            <rect x="475" y="115" width="85" height="100" rx="6" fill="#ECE3D0" stroke="#D9CDB2" stroke-width="1"/>
            <rect x="475" y="235" width="85" height="100" rx="6" fill="#ECE3D0" stroke="#D9CDB2" stroke-width="1"/>

            <!-- 남: 분당 우체국 -->
            <rect x="130" y="355" width="320" height="74" rx="6" fill="#ECE3D0" stroke="#D9CDB2" stroke-width="1"/>
            <text x="290" y="398" text-anchor="middle" font-size="20" font-weight="700">분당 우체국</text>
          </g>

          <!-- ===== 더메리든 건물 본체 (가로형, 강조) ===== -->
          <rect x="130" y="115" width="320" height="220" rx="12" fill="#FFF8EC" stroke="#FF6B1A" stroke-width="2.5"/>

          <!-- 건물 내부 라벨 (PPT 위치 그대로) -->
          <g font-family="'Onglip Uiyeon',serif" fill="#5A5A5A">
            <!-- 상생약국 (북쪽 중앙 상단) -->
            <text x="290" y="160" text-anchor="middle" font-size="15" font-weight="600">상생약국</text>

            <!-- 더 메리든 (중앙 상단, PPT처럼 위쪽 영역) -->
            <text x="290" y="212" text-anchor="middle" font-size="26" font-weight="700" fill="#3D3D3D">더 메리든</text>
            <text x="290" y="232" text-anchor="middle" font-size="13" fill="#9A8568">예식홀 8층</text>

            <!-- 서현순대 (더 메리든 아래쪽 우측) -->
            <text x="395" y="275" text-anchor="middle" font-size="15" font-weight="600">서현순대</text>

            <!-- CGV (좌측 하단) -->
            <text x="220" y="310" text-anchor="middle" font-size="15" font-weight="600">CGV</text>
          </g>

          <!-- ===== 입구 마커 + 화살표 ===== -->
          <!-- ② 북쪽 입구 (상단 중앙, 위에서 아래로 화살표) -->
          <g>
            <line x1="290" y1="100" x2="290" y2="116" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round"/>
            <polygon points="285,113 295,113 290,121" fill="#FF6B1A"/>
            <circle cx="290" cy="115" r="16" fill="#FF6B1A" stroke="#fff" stroke-width="3"/>
            <text x="290" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="sans-serif">2</text>
          </g>
          <!-- ③ 동쪽 입구 (우측 변 중앙, 위치는 그대로 유지) -->
          <g>
            <line x1="465" y1="225" x2="452" y2="225" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round"/>
            <polygon points="455,220 455,230 447,225" fill="#FF6B1A"/>
            <circle cx="450" cy="225" r="16" fill="#FF6B1A" stroke="#fff" stroke-width="3"/>
            <text x="450" y="231" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="sans-serif">3</text>
          </g>
          <!-- ① 남쪽 입구 (하단 중앙, 아래에서 위로 화살표) -->
          <g>
            <line x1="290" y1="350" x2="290" y2="334" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round"/>
            <polygon points="285,337 295,337 290,329" fill="#FF6B1A"/>
            <circle cx="290" cy="335" r="16" fill="#FF6B1A" stroke="#fff" stroke-width="3"/>
            <text x="290" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="sans-serif">1</text>
          </g>

          <!-- ===== 서현역 5번출구 마커 ===== -->
          <circle cx="170" cy="455" r="18" fill="#F4C20D" stroke="#fff" stroke-width="2"/>
          <text x="170" y="460" text-anchor="middle" font-size="11" font-weight="700" fill="#3D3D3D" font-family="'Onglip Uiyeon',serif">5번</text>
          <text x="220" y="460" font-size="13" fill="#5A5A5A" font-family="'Onglip Uiyeon',serif">서현역 5번 출구</text>
        </svg>

        <div class="legend">
          <div class="legend-item"><span class="badge">1</span><div><b>남쪽 입구</b> <span>· CGV 옆 (서현역 방향)</span></div></div>
          <div class="legend-item"><span class="badge">2</span><div><b>북쪽 입구</b> <span>· 상생약국 입구</span></div></div>
          <div class="legend-item"><span class="badge">3</span><div><b>동쪽 입구</b> <span>· 서현순대 옆 입구</span></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
