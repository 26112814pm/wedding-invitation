<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>시안 3: 심플 기어 포인트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Gowun Batang', serif;
  background: linear-gradient(180deg, #FFF9F5 0%, #FFFFFF 40%, #F2E6DC 100%);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
}
.container { text-align: center; }

/* 이름 + 기어 */
.names {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 28px;
  opacity: 0; transform: translateY(10px);
  animation: slideUp 1s ease forwards 0.5s;
}
.name { font-size: 1.8rem; font-weight: 700; color: #3D3D3D; letter-spacing: 4px; }

/* 맞물린 기어 */
.gear-pair {
  display: inline-flex;
  align-items: center;
  position: relative;
  width: 36px; height: 28px;
}
.mini-gear {
  position: absolute;
}
.gear-l { left: 0; top: 0; animation: spinCW 4s linear infinite; }
.gear-r { right: 0; bottom: 0; animation: spinCCW 4s linear infinite; }

@keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spinCCW { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

/* 결혼합니다 */
.message {
  opacity: 0; transform: translateY(12px);
  animation: slideUp 0.8s ease forwards 2.5s;
}
.ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
.dash { width: 50px; height: 1px; background: linear-gradient(to right, transparent, #D4B896, transparent); }
.msg-text { font-size: 1.3rem; color: #5A5A5A; letter-spacing: 6px; }

@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <!-- 이름 + 맞물린 기어 -->
  <div class="names">
    <span class="name">장재균</span>
    <div class="gear-pair">
      <svg class="mini-gear gear-l" width="22" height="22" viewBox="0 0 32 32">
        <g fill="none" stroke="#E8917A" stroke-width="1.2">
          <circle cx="16" cy="16" r="5"/>
          <path d="M16 2v4M16 26v4M2 16h4M26 16h4M5.9 5.9l2.8 2.8M23.3 23.3l2.8 2.8M5.9 26.1l2.8-2.8M23.3 8.7l2.8-2.8"/>
          <circle cx="16" cy="16" r="10" stroke-dasharray="3,3"/>
        </g>
      </svg>
      <svg class="mini-gear gear-r" width="18" height="18" viewBox="0 0 32 32">
        <g fill="none" stroke="#D4B896" stroke-width="1.2">
          <circle cx="16" cy="16" r="5"/>
          <path d="M16 2v4M16 26v4M2 16h4M26 16h4M5.9 5.9l2.8 2.8M23.3 23.3l2.8 2.8M5.9 26.1l2.8-2.8M23.3 8.7l2.8-2.8"/>
          <circle cx="16" cy="16" r="10" stroke-dasharray="3,3"/>
        </g>
      </svg>
    </div>
    <span class="name">배유빈</span>
  </div>

  <!-- 결혼합니다 -->
  <div class="message">
    <div class="ornament">
      <span class="dash"></span>
      <span class="dash"></span>
    </div>
    <p class="msg-text">결혼합니다</p>
  </div>
</div>
</body>
</html>
