<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>시안 1: 톱니바퀴 → 하트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Gowun Batang', serif;
  background: linear-gradient(180deg, #FFF9F5 0%, #FFFFFF 40%, #F2E6DC 100%);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
}
.container {
  text-align: center;
  position: relative;
}

/* 기어 영역 */
.gears {
  position: relative;
  width: 160px; height: 100px;
  margin: 0 auto 30px;
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.gears.hide {
  opacity: 0;
  transform: scale(0.5);
}

/* SVG 기어 */
.gear-left, .gear-right {
  position: absolute;
  top: 50%; transform: translateY(-50%);
}
.gear-left { left: 10px; animation: rotateCW 3s linear infinite; }
.gear-right { right: 10px; animation: rotateCCW 3s linear infinite; }

@keyframes rotateCW { from { transform: translateY(-50%) rotate(0deg); } to { transform: translateY(-50%) rotate(360deg); } }
@keyframes rotateCCW { from { transform: translateY(-50%) rotate(0deg); } to { transform: translateY(-50%) rotate(-360deg); } }

/* 하트 */
.heart-area {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.heart-area.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* 이름 */
.names {
  opacity: 0;
  transform: translateY(15px);
  transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-bottom: 20px;
}
.names.show { opacity: 1; transform: translateY(0); }
.name { font-size: 1.8rem; font-weight: 700; color: #3D3D3D; letter-spacing: 4px; }
.heart-text { color: #E8917A; font-size: 1.2rem; }

/* 결혼합니다 */
.message {
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.message.show { opacity: 1; transform: translateY(0); }
.line { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; }
.dash { width: 50px; height: 1px; background: linear-gradient(to right, transparent, #D4B896, transparent); }
.msg-text { font-size: 1.3rem; color: #5A5A5A; letter-spacing: 6px; }
</style>
</head>
<body>
<div class="container">
  <!-- 톱니바퀴 -->
  <div class="gears" id="gears">
    <svg class="gear-left" width="70" height="70" viewBox="0 0 100 100">
      <path d="M50 15 L54 15 L56 5 L60 5 L62 15 L66 16 L72 8 L76 10 L73 19 L76 22 L85 19 L87 23 L79 28 L80 32 L90 34 L90 38 L80 40 L80 44 L89 49 L87 53 L78 50 L76 54 L83 61 L80 64 L72 59 L69 62 L73 71 L70 73 L63 66 L60 67 L62 77 L58 78 L54 69 L50 69 L50 79 L46 79 L44 69 L40 68 L38 77 L34 76 L36 67 L32 64 L25 71 L22 68 L28 61 L26 57 L17 59 L15 55 L24 50 L23 46 L13 44 L13 40 L23 38 L23 34 L14 30 L16 26 L25 29 L28 26 L23 18 L27 15 L33 22 L37 20 L36 10 L40 9 L42 18 L46 17 L46 7 L50 7 Z" fill="none" stroke="#D4B896" stroke-width="1.5"/>
      <circle cx="50" cy="43" r="15" fill="none" stroke="#D4B896" stroke-width="1.5"/>
      <text x="50" y="47" text-anchor="middle" font-family="'Gowun Batang', serif" font-size="10" fill="#E8917A" font-weight="700">JG</text>
    </svg>
    <svg class="gear-right" width="60" height="60" viewBox="0 0 100 100">
      <path d="M50 15 L54 15 L56 5 L60 5 L62 15 L66 16 L72 8 L76 10 L73 19 L76 22 L85 19 L87 23 L79 28 L80 32 L90 34 L90 38 L80 40 L80 44 L89 49 L87 53 L78 50 L76 54 L83 61 L80 64 L72 59 L69 62 L73 71 L70 73 L63 66 L60 67 L62 77 L58 78 L54 69 L50 69 L50 79 L46 79 L44 69 L40 68 L38 77 L34 76 L36 67 L32 64 L25 71 L22 68 L28 61 L26 57 L17 59 L15 55 L24 50 L23 46 L13 44 L13 40 L23 38 L23 34 L14 30 L16 26 L25 29 L28 26 L23 18 L27 15 L33 22 L37 20 L36 10 L40 9 L42 18 L46 17 L46 7 L50 7 Z" fill="none" stroke="#E8917A" stroke-width="1.5"/>
      <circle cx="50" cy="43" r="15" fill="none" stroke="#E8917A" stroke-width="1.5"/>
      <text x="50" y="47" text-anchor="middle" font-family="'Gowun Batang', serif" font-size="10" fill="#D4B896" font-weight="700">YB</text>
    </svg>
    <!-- 하트 (기어 위에 등장) -->
    <div class="heart-area" id="heart">
      <svg width="40" height="37" viewBox="0 0 24 22" fill="none">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#E8917A" fill-opacity="0.9"/>
      </svg>
    </div>
  </div>

  <!-- 이름 -->
  <div class="names" id="names">
    <span class="name">장재균</span>
    <span class="heart-text">♥</span>
    <span class="name">배유빈</span>
  </div>

  <!-- 결혼합니다 -->
  <div class="message" id="message">
    <div class="line">
      <span class="dash"></span>
      <span class="dash"></span>
    </div>
    <p class="msg-text">결혼합니다</p>
  </div>
</div>

<script>
// 2초: 기어 숨기고 하트 등장
setTimeout(() => {
  document.getElementById('gears').classList.add('hide');
  document.getElementById('heart').classList.add('show');
}, 2000);
// 2.8초: 이름 등장
setTimeout(() => document.getElementById('names').classList.add('show'), 2800);
// 3.8초: 결혼합니다 등장
setTimeout(() => document.getElementById('message').classList.add('show'), 3800);
</script>
</body>
</html>
